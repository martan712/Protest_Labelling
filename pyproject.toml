[project]
name = "protest-labelling"
version = "0.1.0"
description = "Single-label semantic protest-theme classifier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "torch==2.9.1",
    "pytorch-triton-rocm==3.5.1; sys_platform == 'linux'",  # ROCm runtime for torch, see [tool.uv.sources]
    "transformers>=4.40",
    "accelerate>=0.30",
    "matplotlib>=3.8",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
]

[project.scripts]
annotation-review-server = "protest_classifier.cli.annotation_review_server:main"
assemble-annotations = "protest_classifier.cli.assemble_annotations:main"
build-manifests = "protest_classifier.cli.build_manifests:main"
compare-annotations = "protest_classifier.cli.compare_annotations:main"
create-annotation-chunks = "protest_classifier.cli.create_annotation_chunks:main"
evaluate-classifier = "protest_classifier.cli.evaluate_classifier:main"
plot-learning-curve = "protest_classifier.cli.plot_learning_curve:main"
predict-events = "protest_classifier.cli.predict_events:main"
prepare-training-releases = "protest_classifier.cli.prepare_training_releases:main"
train-classifier = "protest_classifier.cli.train_classifier:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

# The AMD Radeon 840M (ROCm) needs the ROCm build of torch; PyPI only ships CUDA builds.
# torch 2.9.1+rocm6.4 is the build verified on this machine.
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }
