[project]
name = "protest-labelling"
version = "0.1.0"
description = "Protest event labelling with supervised, zero-shot and unsupervised NLP models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Data handling / numerics
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    # Classical ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    # Deep learning / transformers
    "torch==2.9.1",
    "pytorch-triton-rocm==3.5.1; sys_platform == 'linux'",  # ROCm runtime for torch, see [tool.uv.sources]
    "transformers>=4.40",
    "datasets>=2.19",
    "accelerate>=0.30",
    "sentence-transformers>=2.7",
    # Topic modelling
    "bertopic>=0.16",
    # NLP utilities
    "nltk>=3.8",
    "tqdm>=4.66",
    # Plotting / reporting
    "matplotlib>=3.8",
    "plotly>=5.20",
    "reportlab>=4.1",
    # HTTP
    "requests>=2.31",
    # Notebook runtime
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
]

[tool.uv]
# Notebook-driven research project; no installable package to build.
package = false

# The AMD Radeon 840M (ROCm) needs the ROCm build of torch; PyPI only ships CUDA builds.
# torch 2.9.1+rocm6.4 is the build verified on this machine.
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }
